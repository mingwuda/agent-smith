[pytest]
# 测试里有裸 async def test_*（test_captcha.py / test_concurrency.py 等集成测试），
# 依赖 pytest-asyncio；auto 模式让这些 async 测试无需逐个打 @pytest.mark.asyncio。
asyncio_mode = auto

# 声明 marker，避免未注册警告
markers =
    integration: 依赖本地运行服务与真实 LLM 的集成测试（需服务在线，手动执行 pytest -m integration）

# 默认排除 integration：它们需要外部服务 + 真实 LLM 调用，跑全量测试不应依赖这些
addopts = -m "not integration"
